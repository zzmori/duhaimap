<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>太行遗产地图 — 涉台抗日红色遗址点位可视化分布图</title>

  <!-- Leaflet CSS（本地文件，无需联网） -->
  <link rel="stylesheet" href="lib/leaflet.css" />

  <!-- 自定义档案卡片样式 -->
  <link rel="stylesheet" href="css/style.css" />

  <style>
    /* ====== 全局与页面布局 ====== */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: "Noto Serif SC", "Source Han Serif SC", "STSong", "SimSun", serif;
      background: #f5f1eb;
    }

    .page-header {
      background: linear-gradient(135deg, #3a2a1a 0%, #5a3a1a 100%);
      color: #faf6f0;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      position: relative;
      z-index: 1000;
    }

    .page-header__icon { font-size: 28px; }

    .page-header h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    .page-header__sub {
      font-size: 12px;
      opacity: 0.75;
      letter-spacing: 0.06em;
    }

    .map-filters {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    }

    .map-filter {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      white-space: nowrap;
    }

    .map-filter select {
      height: 30px;
      min-width: 84px;
      padding: 0 28px 0 10px;
      color: #3a2a1a;
      background: #faf6f0;
      border: 1px solid rgba(255,255,255,0.45);
      border-radius: 3px;
      font-size: 13px;
      cursor: pointer;
    }

    .map-filter__count {
      min-width: 142px;
      padding-left: 12px;
      border-left: 1px solid rgba(255,255,255,0.28);
      font-size: 12px;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }

    .site-search {
      position: relative;
      width: 230px;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    }

    .site-search__input {
      width: 100%;
      height: 30px;
      padding: 0 30px 0 10px;
      color: #3a2a1a;
      background: #faf6f0;
      border: 1px solid rgba(255,255,255,0.45);
      border-radius: 3px;
      outline: none;
      font-size: 13px;
    }

    .site-search__input:focus {
      border-color: #d8bd91;
      box-shadow: 0 0 0 2px rgba(216,189,145,0.2);
    }

    .site-search__icon {
      position: absolute;
      top: 6px;
      right: 8px;
      pointer-events: none;
      font-size: 14px;
      color: #806849;
    }

    .site-search__results {
      display: none;
      position: absolute;
      top: 36px;
      left: 0;
      width: 310px;
      max-height: 320px;
      overflow-y: auto;
      background: #faf6f0;
      border: 1px solid #c8b898;
      border-radius: 3px;
      box-shadow: 0 5px 18px rgba(42,30,18,0.25);
      z-index: 1200;
    }

    .site-search__results--open { display: block; }

    .site-search__result {
      padding: 9px 11px;
      color: #3a2a1a;
      border-bottom: 1px solid #e8ddd0;
      cursor: pointer;
    }

    .site-search__result:last-child { border-bottom: none; }
    .site-search__result:hover { background: #eee3d3; }

    .site-search__result-name {
      font-size: 13px;
      font-weight: 600;
      line-height: 1.4;
    }

    .site-search__result-meta {
      margin-top: 2px;
      color: #8b7355;
      font-size: 11px;
    }

    .site-search__empty {
      padding: 12px;
      color: #8b7355;
      font-size: 12px;
      text-align: center;
    }

    @media (max-width: 760px) {
      .page-header {
        padding: 9px 12px;
        flex-wrap: wrap;
      }

      .page-header__icon { display: none; }
      .page-header h1 { font-size: 16px; }
      .map-filters {
        width: 100%;
        margin-left: 0;
        gap: 8px;
        flex-wrap: wrap;
      }
      .site-search { width: 100%; }
      .site-search__results { width: 100%; }
      .map-filter__count {
        min-width: 0;
        margin-left: auto;
      }
      #map { height: calc(100vh - 104px); }
    }

    /* ====== 地图容器 ====== */
    #map {
      width: 100%;
      height: calc(100vh - 60px);
    }

    .leaflet-container {
      background: #f5f1eb;
    }

    /* ====== 第六章 功能二：左侧侧边栏 ====== */
    .sidebar {
      position: absolute;
      top: 140px;
      left: 12px;
      width: 320px;
      max-height: calc(100vh - 170px);
      z-index: 900;
      background: rgba(250, 246, 240, 0.96);
      border: 1px solid #c8b898;
      border-radius: 4px;
      box-shadow: 0 2px 14px rgba(0,0,0,0.12);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar__header {
      padding: 14px 16px 12px;
      border-bottom: 1px solid #d4c4a8;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      flex-shrink: 0;
    }

    .sidebar__title {
      font-family: "Noto Serif SC", "STSong", "SimSun", Georgia, serif;
      font-size: 16px;
      font-weight: 700;
      color: #3a2a1a;
      letter-spacing: 0.04em;
    }

    .sidebar__count {
      font-size: 12px;
      color: #8b7355;
      letter-spacing: 0.04em;
    }

    .sidebar__list {
      overflow-y: auto;
      flex: 1;
    }

    .sidebar__list::-webkit-scrollbar {
      width: 4px;
    }

    .sidebar__list::-webkit-scrollbar-track {
      background: transparent;
    }

    .sidebar__list::-webkit-scrollbar-thumb {
      background: #d4c4a8;
      border-radius: 2px;
    }

    /* --- 列表项 --- */
    .sidebar-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 12px 16px;
      cursor: pointer;
      border-bottom: 1px solid #e8ddd0;
      transition: background 0.15s;
    }

    .sidebar-item:hover {
      background: rgba(200, 180, 140, 0.15);
    }

    .sidebar-item--active {
      background: rgba(180, 140, 80, 0.18);
      border-left: 3px solid #b8956a;
      padding-left: 13px;
    }

    .sidebar-item__badge {
      flex-shrink: 0;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.06em;
      margin-top: 2px;
    }

    .sidebar-item__badge--A { background: #c0392b; }
    .sidebar-item__badge--B { background: #2c6faa; }
    .sidebar-item__badge--C { background: #3d8b5e; }

    .sidebar-item__info {
      flex: 1;
      min-width: 0;
    }

    .sidebar-item__name {
      font-size: 14px;
      font-weight: 600;
      color: #3a2a1a;
      line-height: 1.4;
      font-family: "Noto Serif SC", "STSong", "SimSun", Georgia, serif;
    }

    .sidebar-item__address {
      font-size: 11px;
      color: #8b7355;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* --- 侧边栏收起按钮 --- */
    .sidebar__toggle {
      position: absolute;
      top: 140px;
      left: 334px;
      z-index: 901;
      width: 22px;
      height: 42px;
      background: rgba(250, 246, 240, 0.96);
      border: 1px solid #c8b898;
      border-left: none;
      border-radius: 0 4px 4px 0;
      cursor: pointer;
      font-size: 12px;
      color: #6b5840;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 2px 0 6px rgba(0,0,0,0.06);
      transition: left 0.3s;
    }

    .sidebar--collapsed {
      transform: translateX(-336px);
      transition: transform 0.3s;
    }

    .sidebar--collapsed + .sidebar__toggle {
      left: 12px;
      border-left: 1px solid #c8b898;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <!-- 顶部标题栏 -->
  <div class="page-header">
    <span class="page-header__icon">🏯</span>
    <div>
      <h1>涉台抗日红色遗址点位可视化分布图</h1>
      <div class="page-header__sub">金华市 · 厦门市 — 太行遗产地图</div>
    </div>
    <div class="map-filters" aria-label="遗址筛选">
      <div class="site-search">
        <input class="site-search__input" id="site-search-input" type="search"
               placeholder="搜索人名、地名或编号" autocomplete="off">
        <span class="site-search__icon">⌕</span>
        <div class="site-search__results" id="site-search-results"></div>
      </div>
      <label class="map-filter">
        <span>城市</span>
        <select id="city-filter">
          <option value="all">全部</option>
          <option value="JH">金华</option>
          <option value="XM">厦门</option>
        </select>
      </label>
      <label class="map-filter">
        <span>级别</span>
        <select id="level-filter">
          <option value="all">全部</option>
          <option value="A">A</option>
          <option value="B">B</option>
          <option value="C">C</option>
        </select>
      </label>
      <div class="map-filter__count" id="filter-count">当前显示 22 / 共 22 处</div>
    </div>
  </div>

  <!-- 地图容器 -->
  <div id="map"></div>

  <!-- ====== 第六章 功能二：左侧侧边栏 ====== -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar__header">
      <span class="sidebar__title">遗址列表</span>
      <span class="sidebar__count" id="sidebar-count">—</span>
    </div>
    <div class="sidebar__list" id="sidebar-list">
      <!-- JS 动态生成 -->
    </div>
  </div>
  <div class="sidebar__toggle" id="sidebar-toggle" title="收起/展开侧边栏">◀</div>

  <!-- Leaflet JS（本地文件，无需联网） -->
  <script src="lib/leaflet.js"></script>

  <!-- 业务脚本 -->
  <script src="js/map.js"></script>
  <script src="js/sites-data.js"></script>

  <script>
    // ==============================================
    //  初始化地图
    // ==============================================
    var map = L.map('map').setView([26.5, 118.5], 8);

    // ---- 底图：高德地图中文底图（国内网络可访问） ----
    var amapLayer = L.tileLayer(
      'https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}',
      {
        subdomains: '1234',
        maxZoom: 18,
        attribution: '&copy; 高德地图',
      }
    );

    // ---- 国内备用底图：GeoQ 智图中文社区图 ----
    var geoqLayer = L.tileLayer(
      'https://map.geoq.cn/ArcGIS/rest/services/ChinaOnlineCommunity/MapServer/tile/{z}/{y}/{x}',
      {
        maxZoom: 18,
        attribution: '&copy; GeoQ 智图',
      }
    );

    var hasSwitchedBasemap = false;
    amapLayer.addTo(map);
    amapLayer.on('tileerror', function () {
      if (hasSwitchedBasemap) return;
      hasSwitchedBasemap = true;
      console.warn('高德底图加载失败，自动切换到 GeoQ 国内备用底图');
      map.removeLayer(amapLayer);
      geoqLayer.addTo(map);
    });

    // ==============================================
    //  侧边栏 — 折叠/展开
    // ==============================================
    var sidebar = document.getElementById('sidebar');
    var sidebarToggle = document.getElementById('sidebar-toggle');
    var sidebarCollapsed = false;

    sidebarToggle.addEventListener('click', function () {
      sidebarCollapsed = !sidebarCollapsed;
      if (sidebarCollapsed) {
        sidebar.classList.add('sidebar--collapsed');
        sidebarToggle.textContent = '▶';
      } else {
        sidebar.classList.remove('sidebar--collapsed');
        sidebarToggle.textContent = '◀';
      }
    });

    // ==============================================
    //  第六章 功能二：侧边栏列表生成 & 双向联动
    // ==============================================
    var markerRegistry = [];   // [{ marker, feature, listItem }]
    var totalSiteCount = 0;
    var storyLineLayer = L.featureGroup().addTo(map);

    map.createPane('storyLinePane');
    map.getPane('storyLinePane').style.zIndex = 425;

    function getFeatureCity(feature) {
      var id = String((feature.properties || {}).id || '').toUpperCase();
      return id.indexOf('JH-') === 0 ? 'JH' : (id.indexOf('XM-') === 0 ? 'XM' : '');
    }

    function drawAntiWarStoryLine(geojson) {
      var routeIds = ['JH-01', 'JH-02', 'JH-03', 'XM-07', 'XM-03', 'XM-02', 'XM-01'];
      var featureById = {};
      var routePoints = [];

      storyLineLayer.clearLayers();

      for (var i = 0; i < geojson.features.length; i++) {
        var feature = geojson.features[i];
        var id = String((feature.properties || {}).id || '').toUpperCase();
        featureById[id] = feature;
      }

      for (var j = 0; j < routeIds.length; j++) {
        var routeFeature = featureById[routeIds[j]];
        if (!routeFeature || !routeFeature.geometry ||
            routeFeature.geometry.type !== 'Point') continue;

        var coords = routeFeature.geometry.coordinates;
        routePoints.push([coords[1], coords[0]]);
      }

      if (routePoints.length < 2) return;

      var storyLine = L.polyline(routePoints, {
        pane: 'storyLinePane',
        color: '#8f2f25',
        weight: 4,
        opacity: 0.78,
        dashArray: '10 9',
        lineCap: 'round',
        lineJoin: 'round'
      });

      storyLine.bindTooltip(
        '台湾义勇队抗战活动故事线（示意连接，非实际行进路线）',
        { sticky: true, direction: 'top', opacity: 0.95 }
      );
      storyLine.addTo(storyLineLayer);
    }

    function applyFilters() {
      var city = document.getElementById('city-filter').value;
      var level = document.getElementById('level-filter').value;
      var visibleCount = 0;

      for (var i = 0; i < markerRegistry.length; i++) {
        var entry = markerRegistry[i];
        var props = entry.feature.properties || {};
        var cityMatches = city === 'all' || getFeatureCity(entry.feature) === city;
        var levelMatches = level === 'all' || String(props.level || '').toUpperCase() === level;
        var shouldShow = cityMatches && levelMatches;

        entry.listItem.style.display = shouldShow ? '' : 'none';

        if (entry.marker) {
          if (shouldShow && !heritageLayer.hasLayer(entry.marker)) {
            heritageLayer.addLayer(entry.marker);
          } else if (!shouldShow && heritageLayer.hasLayer(entry.marker)) {
            heritageLayer.removeLayer(entry.marker);
          }
        }

        if (shouldShow) visibleCount++;
      }

      document.getElementById('filter-count').textContent =
        '当前显示 ' + visibleCount + ' / 共 ' + totalSiteCount + ' 处';
      document.getElementById('sidebar-count').textContent =
        '显示 ' + visibleCount + ' / ' + totalSiteCount + ' 处';
    }

    function locateSearchResult(index) {
      var entry = markerRegistry[index];
      if (!entry || !entry.marker) return;

      // 搜索结果可能被组合筛选隐藏；定位时恢复全部显示。
      document.getElementById('city-filter').value = 'all';
      document.getElementById('level-filter').value = 'all';
      applyFilters();

      var latlng = entry.marker.getLatLng();
      map.flyTo(latlng, 15, { duration: 0.8 });
      entry.marker.openPopup();
      highlightSidebarItem(index);

      document.getElementById('site-search-results')
        .classList.remove('site-search__results--open');
    }

    function updateSearchResults() {
      var input = document.getElementById('site-search-input');
      var container = document.getElementById('site-search-results');
      var keyword = input.value.trim().toLowerCase();
      container.innerHTML = '';

      if (!keyword) {
        container.classList.remove('site-search__results--open');
        return;
      }

      var matches = [];
      for (var i = 0; i < markerRegistry.length; i++) {
        var props = markerRegistry[i].feature.properties || {};
        var searchable = [
          props.id,
          props.name,
          props.address,
          props.people,
          props.blurb,
          props.type
        ].join(' ').toLowerCase();

        if (searchable.indexOf(keyword) !== -1) matches.push(i);
      }

      if (matches.length === 0) {
        var empty = document.createElement('div');
        empty.className = 'site-search__empty';
        empty.textContent = '没有找到相关遗址';
        container.appendChild(empty);
      } else {
        for (var j = 0; j < matches.length; j++) {
          (function (idx) {
            var props = markerRegistry[idx].feature.properties || {};
            var result = document.createElement('div');
            result.className = 'site-search__result';
            result.innerHTML =
              '<div class="site-search__result-name">' +
              escapeHTML((props.id || '') + ' · ' + (props.name || '未命名遗址')) +
              '</div><div class="site-search__result-meta">' +
              escapeHTML((getFeatureCity(markerRegistry[idx].feature) === 'JH' ? '金华' : '厦门') +
                ' · ' + (props.level || '') + '级 · ' + (props.address || '地址待补充')) +
              '</div>';
            result.addEventListener('click', function () {
              locateSearchResult(idx);
            });
            container.appendChild(result);
          })(matches[j]);
        }
      }

      container.classList.add('site-search__results--open');
    }

    /**
     * 高亮指定索引的列表项，并滚动到可见区域
     */
    function highlightSidebarItem(index) {
      // 清除所有高亮
      var items = document.querySelectorAll('.sidebar-item');
      for (var k = 0; k < items.length; k++) {
        items[k].classList.remove('sidebar-item--active');
      }
      // 高亮目标
      if (index >= 0 && index < markerRegistry.length) {
        var entry = markerRegistry[index];
        if (entry && entry.listItem) {
          entry.listItem.classList.add('sidebar-item--active');
          entry.listItem.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        }
      }
    }

    /**
     * 根据 GeoJSON 构建侧边栏列表
     */
    function buildSidebarList(geojson) {
      var listContainer = document.getElementById('sidebar-list');
      var countEl = document.getElementById('sidebar-count');
      listContainer.innerHTML = '';

      var features = geojson.features;
      totalSiteCount = features.length;
      countEl.textContent = '共 ' + features.length + ' 处';

      for (var i = 0; i < features.length; i++) {
        var props = features[i].properties || {};
        var level = (props.level || 'C').toUpperCase();

        // 创建列表项 DOM
        var item = document.createElement('div');
        item.className = 'sidebar-item';

        // 等级圆形徽章
        var badge = document.createElement('span');
        badge.className = 'sidebar-item__badge sidebar-item__badge--' + level;
        badge.textContent = level;

        // 信息区
        var info = document.createElement('div');
        info.className = 'sidebar-item__info';

        var nameEl = document.createElement('div');
        nameEl.className = 'sidebar-item__name';
        nameEl.textContent = props.name || '（未命名）';

        var addrEl = document.createElement('div');
        addrEl.className = 'sidebar-item__address';
        addrEl.textContent = props.address || '';

        info.appendChild(nameEl);
        info.appendChild(addrEl);
        item.appendChild(badge);
        item.appendChild(info);

        // 列表项点击 → flyTo + 打开 popup
        (function (idx) {
          item.addEventListener('click', function () {
            var entry = markerRegistry[idx];
            if (!entry || !entry.marker) return;

            var latlng = entry.marker.getLatLng();
            map.flyTo(latlng, 15, { duration: 0.8 });
            entry.marker.openPopup();
            highlightSidebarItem(idx);
          });
        })(i);

        listContainer.appendChild(item);

        // 暂存列表项引用（marker 尚未创建，先存 listItem）
        markerRegistry.push({ marker: null, feature: features[i], listItem: item });
      }
    }

    /**
     * 将已创建的 marker 绑定到 registry 并注册联动事件
     */
    function bindMarkerEvents(group) {
      group.eachLayer(function (layer) {
        var idx = layer._heritageIndex;
        if (idx == null || !markerRegistry[idx]) return;

        markerRegistry[idx].marker = layer;

        // marker 被点击（popup 打开）→ 高亮对应列表项
        layer.on('popupopen', function () {
          highlightSidebarItem(idx);
        });
      });
    }

    // ==============================================
    //  内嵌 GeoJSON 数据（无需 fetch，双击打开也能用）
    // ==============================================
    // SITES_DATA 由 js/sites-data.js 提供，支持直接双击打开。

    // ==============================================
    //  加载遗址数据（内嵌数据，无需 fetch）
    // ==============================================
    var heritageLayer = L.featureGroup().addTo(map);

    // 直接使用内嵌的 SITES_DATA，无需 fetch，双击 file:// 也能正常加载
    (function () {
      var geojson = SITES_DATA;
      console.log('遗址数据加载成功，共 ' + geojson.features.length + ' 个点位');

      // 第六章 功能二：先生成侧边栏列表
      buildSidebarList(geojson);

      // 第六章 功能一：渲染 marker
      renderHeritageMarkers(map, geojson, heritageLayer);

      // 将相关散点串联为台湾义勇队抗战活动故事线
      drawAntiWarStoryLine(geojson);

      // 绑定 marker ↔ 列表项 双向联动
      bindMarkerEvents(heritageLayer);

      document.getElementById('city-filter').addEventListener('change', applyFilters);
      document.getElementById('level-filter').addEventListener('change', applyFilters);
      document.getElementById('site-search-input').addEventListener('input', updateSearchResults);
      document.getElementById('site-search-input').addEventListener('keydown', function (event) {
        if (event.key === 'Enter') {
          var firstResult = document.querySelector('.site-search__result');
          if (firstResult) firstResult.click();
        } else if (event.key === 'Escape') {
          document.getElementById('site-search-results')
            .classList.remove('site-search__results--open');
        }
      });
      document.addEventListener('click', function (event) {
        if (!event.target.closest('.site-search')) {
          document.getElementById('site-search-results')
            .classList.remove('site-search__results--open');
        }
      });
      applyFilters();

      // 自动缩放到所有点位
      var bounds = heritageLayer.getBounds();
      if (bounds.isValid()) {
        map.fitBounds(bounds, { padding: [40, 40], maxZoom: 12 });
      }
    })();
  </script>

</body>
